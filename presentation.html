  <script>
    const slides = [{"id": 1, "category": "ENTERPRISE DEVELOPER SUITE", "title": "DevCollab", "subtitle": "Full-Stack Developer Collaboration & Workspace Platform", "desc": "Unifying Agile Sprints, Issue Tracking, Peer Code Reviews, GitHub Telemetry & AI Documentation into a single developer cockpit.", "badges": ["React 18 + Vite", "Node.js 24 & Express", "MySQL 8.0 Relational DB", "GitHub REST API v3", "Google Gemini AI Engine", "Docker & CI/CD"], "footer_meta": "Presenter: Temba Reni Goutham | Live Demo: https://tembarenigoutham.github.io/Developer-Collaboration-Platform/ | Status: Production-Grade", "speaker_notes": "Welcome everyone. Today I am presenting DevCollab, an enterprise-ready, full-stack developer workspace and team collaboration platform. Modern engineering teams struggle with context switching between Jira, GitHub, Notion, and Slack. DevCollab provides an integrated single-pane-of-glass solution built with React 18, Node.js, Express, MySQL 8, GitHub APIs, and Google Gemini AI."}, {"id": 2, "category": "CHALLENGE & INDUSTRY MOTIVATION", "title": "The Problem: Fragmented Developer Ecosystems", "cards": [{"title": "1. Severe Tool Sprawl", "tag": "Inefficiency", "tag_color": "rose", "items": ["Dev teams use 5-8 disparate SaaS tools daily: Jira, GitHub, Slack, Notion, Datadog.", "Constant context switching wastes ~20% of engineering productive time.", "Data silos prevent holistic sprint and project visibility."]}, {"title": "2. Code & Sprint Disconnect", "tag": "Friction", "tag_color": "amber", "items": ["Task boards are decoupled from pull requests and actual code commits.", "Status tracking relies on manual dev updates, leading to outdated boards.", "Code review bottlenecks go unnoticed until release day."]}, {"title": "3. Documentation Debt", "tag": "Quality Deficit", "tag_color": "cyan", "items": ["Engineers dread writing setup guides, READMEs, and technical documentation.", "Docs quickly become obsolete as APIs evolve.", "Onboarding new engineers takes weeks due to missing architectural documentation."]}], "speaker_notes": "Software teams face three major bottlenecks: first, severe tool sprawl where developers lose up to 20% of their day switching between apps; second, a disconnect between agile task boards and real code changes in Git; and third, documentation debt where technical guides become obsolete as fast as APIs change."}, {"id": 3, "category": "VALUE PROPOSITION & PRODUCT VISION", "title": "The Solution: A Unified Developer Cockpit", "cards": [{"title": "Unified Workspace", "tag": "Workspace", "tag_color": "cyan", "items": ["Single application housing projects, sprints, tasks, issues, and peer reviews.", "Role-Based Access Control (RBAC) ensuring enterprise security.", "Team members collaborate within multi-tenant project sandboxes."]}, {"title": "Real-Time Git Telemetry", "tag": "Integration", "tag_color": "indigo", "items": ["Direct GitHub REST API integration brings repository insights into the dashboard.", "Live branch tracking, pull requests, commits, and star/fork metrics.", "Zero-latency visibility without switching browser tabs."]}, {"title": "AI-Assisted Synthesis", "tag": "AI Automation", "tag_color": "emerald", "items": ["Powered by Google Gemini Generative AI for automated documentation.", "Generate READMEs, API specifications, and architectural summaries in seconds.", "Live in-browser markdown editor with direct database persistence."]}], "speaker_notes": "DevCollab eliminates tool sprawl by providing a unified developer cockpit. It brings together agile sprint management, issue defect tracking, peer code review assignment, live GitHub repository telemetry, and instant AI-assisted technical documentation synthesis into one lightning-fast, cohesive developer experience."}, {"id": 4, "category": "TECHNICAL ARCHITECTURE", "title": "System Architecture & End-to-End Data Flow", "cards": [{"title": "Presentation Tier", "tag": "Client Layer", "tag_color": "cyan", "items": ["React 18 Single Page App (SPA)", "Vite High-Speed Bundler", "React Router v6 (15+ View Pages)", "Axios HTTP Client with Bearer Token Interceptors", "Modern SaaS Dark UI Design System"]}, {"title": "Application API Tier", "tag": "REST API", "tag_color": "indigo", "items": ["Node.js (v24 LTS) & Express.js", "Stateless JWT Authentication", "Granular RBAC Authorization", "Centralized Error Handler", "Clean Controller-Service-Route Architecture"]}, {"title": "Data Persistence Tier", "tag": "Database", "tag_color": "emerald", "items": ["MySQL 8.0 Relational Database", "mysql2/promise with Connection Pool", "11 Normalized Tables (3NF)", "Foreign Key Cascade Constraints", "Prepared Parameterized Queries"]}, {"title": "External Services Tier", "tag": "Cloud & Services", "tag_color": "purple", "items": ["GitHub REST API v3 (Repo, Commits, PRs, Branches)", "Google Gemini 1.5 Flash AI API (Automated Tech Docs)", "Docker Containerization", "GitHub Actions CI/CD Pipeline"]}], "speaker_notes": "Here is our 3-tier enterprise architecture. At the top is the Presentation Tier: a modern React 18 SPA powered by Vite, offering 15+ pages with a dark-mode SaaS UI. The Application Tier runs Node.js 24 LTS and Express.js, featuring stateless JWT auth and RBAC middleware. The Data Tier uses MySQL 8.0 with normalized relational schemas and connection pooling. Finally, the External Services Tier interfaces directly with the GitHub REST API and Google's Gemini AI engine."}, {"id": 5, "category": "TECH STACK SPECIFICATIONS", "title": "Technology Stack & Engineering Decisions", "table": {"headers": ["Layer / Domain", "Technologies Used", "Key Responsibilities", "Why Selected?"], "rows": [["Frontend Client", "React 18, Vite, React Router 6, Axios, Lucide Icons", "Component UI, interactive Kanban, markdown editor, client routing", "High rendering performance, component reusability, sub-second HMR"], ["Backend Services", "Node.js v24 LTS, Express.js, JWT, bcryptjs, CORS", "REST endpoints, auth middleware, request validation, business logic", "Event-driven asynchronous I/O, lightweight execution, rapid scalability"], ["Database Engine", "MySQL 8.0, mysql2/promise, Connection Pooling", "Normalized relational storage, transactional safety, indexing", "Strong ACID compliance, relational integrity, zero data corruption"], ["Cloud & External", "GitHub REST API v3, Google Gemini API, Docker, Render", "Repository data sync, AI documentation, containerized deployment", "Industry standard REST APIs, state-of-the-art LLM capabilities, portable containers"]]}, "speaker_notes": "Let's examine the tech stack rationale. We selected React 18 with Vite because Vite provides sub-second Hot Module Replacement and optimized rollups. On the backend, Node.js and Express handle concurrent REST requests with minimal overhead. MySQL 8.0 provides rock-solid ACID transactions with foreign keys, preventing orphan records. Docker ensures identical execution across local dev and production clouds like Render."}, {"id": 6, "category": "DATABASE DESIGN & INTEGRITY", "title": "Relational Database Schema & Data Modeling", "cards": [{"title": "User & Workspace Entities", "tag": "Auth & Members", "tag_color": "cyan", "items": ["users: id, name, email (unique), password (hash), system_role.", "projects: id, name, description, owner_id (FK), github_repo.", "project_members: id, project_id, user_id, role (OWNER, ADMIN, DEVELOPER, VIEWER).", "Unique constraint prevents duplicate team memberships."]}, {"title": "Sprint & Defect Entities", "tag": "Agile Tracking", "tag_color": "amber", "items": ["tasks: project_id, assigned_to, created_by, status (TODO, IN_PROGRESS, REVIEW, DONE), priority.", "issues: project_id, reported_by, assigned_to, priority, status (OPEN, IN_PROGRESS, RESOLVED, CLOSED).", "issue_comments: relational discussion thread per defect."]}, {"title": "Reviews, AI Docs & Alerts", "tag": "Collaboration", "tag_color": "emerald", "items": ["code_reviews: project_id, pull_request_url, submitted_by, reviewer_id, status.", "review_comments: threaded peer review feedback.", "documents: generated & custom markdown documentation.", "github_accounts: secure tokens & GitHub mappings.", "notifications: user alert queues & unread counters."]}], "speaker_notes": "DevCollab's database is structured into 11 normalized tables following Third Normal Form (3NF). Every relationship enforces ON DELETE CASCADE constraints so that removing a project cleanly cleans up associated tasks, issues, and documents. We've placed targeted indexes on foreign keys, email lookups, and status filters to achieve millisecond query latencies even with thousands of records."}, {"id": 7, "category": "APPLICATION SECURITY", "title": "Enterprise Security, Authentication & RBAC", "cards": [{"title": "Cryptographic Authentication", "tag": "Auth Protocol", "tag_color": "cyan", "items": ["Passwords hashed using bcryptjs with 10 salt rounds.", "Stateless JSON Web Tokens (JWT) signed with HMAC-SHA256.", "Configurable token expiry (7 days default).", "Bearers transmitted via Authorization header on all protected endpoints."]}, {"title": "Granular Role-Based Access", "tag": "Access Control", "tag_color": "indigo", "items": ["OWNER: Full project lifecycle, deletion, and member administration.", "ADMIN: Member invitations, role modifications, settings management.", "DEVELOPER: Create & update tasks, report issues, submit code reviews.", "VIEWER: Read-only access to sprint boards, docs, and repositories."]}, {"title": "Application Hardening", "tag": "Defensive Security", "tag_color": "rose", "items": ["Parameterized SQL Queries: Zero vulnerability to SQL Injection.", "CORS Whitelisting: Configurable origin controls preventing CSRF.", "Centralized Error Handler: Prevents leaking stack traces in production.", "Token verification middleware rejecting tampered/expired tokens."]}], "speaker_notes": "Security is built-in by design. We use bcrypt password hashing with 10 rounds of salt to resist brute force and rainbow table attacks. Authentication uses stateless JWT tokens. Our Role-Based Access Control differentiates between Owners, Admins, Developers, and Viewers. In addition, all database transactions use prepared statements, eliminating SQL injection attacks entirely."}, {"id": 8, "category": "CORE FEATURE #1", "title": "Feature Deep Dive: Agile Sprint & Kanban Board", "cards": [{"title": "4-Lane Workflow State", "tag": "Visual Board", "tag_color": "cyan", "items": ["TODO: Backlog items ready for sprint execution.", "IN_PROGRESS: Active development tasks currently being worked on.", "REVIEW: Completed code undergoing peer review or QA testing.", "DONE: Validated milestones deployed to production."]}, {"title": "Rich Task Metadata", "tag": "Task Metadata", "tag_color": "amber", "items": ["Four-tier priority badges: LOW, MEDIUM, HIGH, CRITICAL.", "Assignee avatars and creator tracking.", "Due dates with automatic visual overdue indicators.", "Rich text descriptions detailing acceptance criteria."]}, {"title": "Interactive Controls", "tag": "Productivity", "tag_color": "emerald", "items": ["Dynamic drag/drop and one-click status transitions.", "Filter tasks by assignee, priority, or keyword search in real-time.", "Instant completion progress bars displayed on project dashboard.", "Instant task creation modal with member dropdown selectors."]}], "speaker_notes": "Our Kanban Task Board provides real-time sprint visibility. It uses a 4-lane pipeline: TODO, In Progress, Review, and Done. Tasks feature four priority tiers, due date warnings, assignee avatars, and instant search/filtering. On the project dashboard, overall milestone completion rates update dynamically as tasks transition to Done."}, {"id": 9, "category": "CORE FEATURE #2", "title": "Feature Deep Dive: Defect & Bug Tracking", "cards": [{"title": "Issue Lifecycle Management", "tag": "Defect Lifecycle", "tag_color": "rose", "items": ["Standardized states: OPEN, IN_PROGRESS, RESOLVED, CLOSED.", "Severity triage: LOW, MEDIUM, HIGH, ub's rate limit ceiling from 60 to 5,000 calls an hour with resilient fallback handling."}, {"id": 12, "category": "CORE FEATURE #5", "title": "Feature Deep Dive: AI-Assisted Documentation Synthesizer", "cards": [{"title": "Google Gemini AI Engine", "tag": "AI Synthesis", "tag_color": "purple", "items": ["Integrates Google Gemini 1.5 Flash LLM for smart synthesis.", "Context-aware prompt engineering incorporating project name, description, and tech stack.", "Generates production-grade Markdown in under 3 seconds.", "Includes smart fallback synthesizer for offline resilience."]}, {"title": "One-Click Documentation Types", "tag": "Doc Formats", "tag_color": "cyan", "items": ["README.md: Installation, badges, scripts, usage, and architecture overview.", "API Documentation: REST endpoints, request/response payloads, auth schemas.", "Developer Setup Guide: Prerequisites, environment variables, DB setup.", "Architecture Summary: Component diagrams and data flow blueprints."]}, {"title": "In-Browser Markdown Studio", "tag": "Studio Editor", "tag_color": "emerald", "items": ["Split-screen live Markdown preview with syntax highlighting.", "One-click 'Copy to Clipboard' and 'Download .md File'.", "Direct persistence into MySQL documents table for team sharing.", "Full versioned edit history for technical documentation."]}], "speaker_notes": "One of DevCollab's most innovative capabilities is AI-Assisted Documentation. Using Google's Gemini 1.5 Flash model, developers can generate comprehensive READMEs, REST API docs, and developer onboarding guides with a single click. The in-browser markdown editor allows instant previewing, editing, downloading, and database saving."}, {"id": 13, "category": "CORE FEATURE #6", "title": "Feature Deep Dive: Notification & Alert Engine", "cards": [{"title": "Event-Driven Alert Triggers", "tag": "Event Triggers", "tag_color": "cyan", "items": ["Task Assignment: Alerts developer when assigned a new sprint ticket.", "Issue Logged: Notifies team when a high/critical defect is created.", "Review Requested: Alerts senior engineers to inspect a submitted PR.", "Review Approved / Changes: Alerts author of code review verdict."]}, {"title": "Interactive User Experience", "tag": "User Experience", "tag_color": "indigo", "items": ["Persistent notification bell in navbar with real-time unread counter badge.", "Dedicated Notifications page with full chronological history.", "One-click 'Mark as Read' and 'Mark All as Read' bulk actions.", "Quick delete action to dismiss completed notifications."]}, {"title": "Database Persistence & Sync", "tag": "Reliability", "tag_color": "emerald", "items": ["Stored in dedicated notifications table with user foreign key.", "Indexed on (user_id, is_read) for instant count(*) execution.", "Lightweight pollers keep notification state synchronised across tabs.", "Zero notification loss even across user logout and re-login."]}], "speaker_notes": "Our activity notification engine keeps developers aligned. Triggered by task assignments, issue reports, and code reviews, notifications appear in a sticky navbar counter and dedicated inbox. Backed by relational database persistence with optimized composite indexes, users never miss critical project events."}, {"id": 14, "category": "DEPLOYMENT ARCHITECTURE", "title": "DevOps, Containerization & CI/CD Pipeline", "cards": [{"title": "Multi-Container Docker", "tag": "Containerization", "tag_color": "cyan", "items": ["docker-compose.yml orchestrates 3 isolated services:", "1. devcollab-mysql: MySQL 8.0 with auto-seeded schema & volumes.", "2. devcollab-backend: Node.js 24 Alpine container on Port 5000.", "3. devcollab-frontend: Production Nginx web server on Port 80.", "Health checks guarantee backend starts only after DB is ready."]}, {"title": "Automated GitHub Actions CI/CD", "tag": "Pipelines", "tag_color": "indigo", "items": ["Continuous Integration: Validates code, runs linting, executes builds.", "Continuous Deployment: Deploys React client to GitHub Pages automatically on push to main.", "Automated secret management for API keys and database credentials."]}, {"title": "Multi-Cloud Production Hosting", "tag": "Cloud Hosting", "tag_color": "emerald", "items": ["Frontend: Hosted on GitHub Pages & Vercel edge CDN for sub-50ms latency.", "Backend: Configured for Render.com Web Services via render.yaml.", "Database: Managed MySQL cluster with SSL and persistent volumes.", "Production-ready CORS, environment configuration, and health check endpoints."]}], "speaker_notes": "DevCollab is built for enterprise deployment. Using Docker Compose, developers spin up the entire 3-tier stack\u2014database, Express backend, and Nginx frontend\u2014with a single command: docker-compose up. Our CI/CD pipeline on GitHub Actions builds and validates every commit, deploying the frontend to GitHub Pages and the backend to Render."}, {"id": 15, "category": "IMPACT & ROADMAP", "title": "Project Impact & Future Enhancements", "cards": [{"title": "Quantifiable Project Impact", "tag": "Measured Metrics", "tag_color": "emerald", "items": ["Centralized 5 developer tools into 1 unified web interface.", "Reduced documentation creation time by 85% via Gemini AI synthesis.", "Zero-configuration Docker onboarding in under 2 minutes.", "Sub-100ms API response times via prepared SQL queries & connection pooling."]}, {"title": "Phase 2 Roadmap (Q3-Q4)", "tag": "Upcoming Features", "tag_color": "cyan", "items": ["WebSocket / Socket.io: Real-time collaborative live cursor editing.", "AI Code Review Bot: Automatic automated code analysis directly on PR submissions.", "Slack & Discord Webhooks: Pushing sprint milestones to team chat channels.", "Kanban Swimlanes: Epics, custom workflow states, and burndown charts."]}, {"title": "Phase 3 Long-Term Vision", "tag": "Long-Term Vision", "tag_color": "purple", "items": ["GitLab & Bitbucket Multi-VCS support.", "Self-hosted LLM support (Ollama / LLaMA 3) for on-premise air-gapped security.", "Native     let currentIdx = 0;

    function renderSlide(idx) {
      const s = slides[idx];
      const stage = document.getElementById('slideStage');
      
      let bodyHtml = '';

      if (s.id === 1) {
        bodyHtml = `
          <div class="flex flex-col justify-center items-start flex-1 py-6">
            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-cyan-950 text-cyan-400 border border-cyan-700/60 tracking-wider uppercase mb-4">
              ${s.category}
            </span>
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-white mb-3">
              ${s.title}
            </h1>
            <h2 class="text-xl md:text-2xl font-semibold text-cyan-400 mb-4">
              ${s.subtitle}
            </h2>
            <p class="text-base text-slate-400 max-w-3xl leading-relaxed mb-8">
              ${s.desc}
            </p>

            <div class="flex flex-wrap gap-2.5 mb-8">
              ${s.badges.map(b => `<span class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-[#1a233a] border border-[#2d3d66] text-slate-200">${b}</span>`).join('')}
            </div>

            <div class="pt-6 border-t border-slate-800/80 w-full flex flex-col sm:flex-row items-start sm:items-center justify-between text-xs text-slate-500 gap-2">
              <span>${s.footer_meta}</span>
              <span class="font-mono text-cyan-500">tembarenigoutham.github.io</span>
            </div>
          </div>
        `;
      } 
      else if (s.table) {
        bodyHtml = `
          <div>
            <div class="mb-6">
              <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">${s.category}</span>
              <h2 class="text-3xl font-extrabold text-white mt-1">${s.title}</h2>
              <div class="w-16 h-1 bg-cyan-500 rounded mt-2"></div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-800">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-800/80 text-cyan-400 uppercase text-[11px] font-bold border-b border-slate-700">
                  <tr>
                    ${s.table.headers.map(h => `<th class="p-3.5">${h}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/70 bg-[#161e31]">
                  ${s.table.rows.map(row => `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                      <td class="p-3.5 font-bold text-white">${row[0]}</td>
                      <td class="p-3.5 text-slate-300">${row[1]}</td>
                      <td class="p-3.5 text-slate-300">${row[2]}</td>
                      <td class="p-3.5 text-cyan-300/90">${row[3]}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
      else if (s.cards) {
        const cols = s.cards.length === 4 ? 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-4' : 'grid-cols-1 md:grid-cols-3';
        bodyHtml = `
          <div>
            <div class="mb-6">
              <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">${s.category}</span>
              <h2 class="text-3xl font-extrabold text-white mt-1">${s.title}</h2>
              ${s.subtitle ? `<p class="text-sm text-cyan-400 mt-1">${s.subtitle}</p>` : ''}
              <div class="w-16 h-1 bg-cyan-500 rounded mt-2"></div>
            </div>

            <div class="grid ${cols} gap-4">
              ${s.cards.map(c => `
                <div class="slide-card rounded-xl p-5 border border-slate-700/60 flex flex-col justify-between hover:border-slate-600 transition-all shadow-md">
                  <div>
                    <div class="flex items-center justify-between mb-3">
                      <span class="text-[10px] font-bold tracking-wider px-2 py-0.5 rounded uppercase ${
                        c.tag_color === 'rose' ? 'bg-rose-950 text-rose-400 border border-rose-800/50' :
                        c.tag_color === 'amber' ? 'bg-amber-950 text-amber-400 border border-amber-800/50' :
                        c.tag_color === 'emerald' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/50' :
                        c.tag_color === 'purple' ? 'bg-purple-950 text-purple-400 border border-purple-800/50' :
                        c.tag_color === 'indigo' ? 'bg-indigo-950 text-indigo-400 border border-indigo-800/50' :
                        'bg-cyan-950 text-cyan-400 border border-cyan-800/50'
                      }">
                        ${c.tag}
                      </span>
                    </div>
                    <h3 class="text-base font-bold text-white mb-3">${c.title}</h3>
                    <ul class="space-y-2 text-xs text-slate-400">
                      ${c.items.map(item => `
                        <li class="flex items-start gap-1.5">
                          <span class="text-cyan-400 mt-0.5">&bull;</span>
                          <span>${item}</span>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      stage.innerHTML = `
        <div class="flex flex-col justify-between h-full">
          ${bodyHtml}
          <div class="pt-6 mt-6 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-500">
            <span>DevCollab Project Architecture & Technical Deck</span>
            <span class="font-mono text-cyan-400">Slide ${s.id} of 16</span>
          </div>
        </div>
      `;

      document.getElementById('slideCounter').innerText = `Slide ${s.id} / 16`;
      document.getElementById('progressBar').style.width = `${((s.id) / 16) * 100}%`;
      document.getElementById('notesContent').innerText = s.speaker_notes || "No notes for this slide.";
    }

    function nextSlide() {
      if (currentIdx < slides.length - 1) {
        currentIdx++;
        renderSlide(currentIdx);
      }
    }

    function prevSlide() {
      if (currentIdx > 0) {
        currentIdx--;
        renderSlide(currentIdx);
      }
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const panel = document.getElementById('notesPanel');
      const btn = document.getElementById('toggleNotesBtn');
      if (showNotes) {
        panel.classList.remove('hidden');
        btn.classList.add('bg-cyan-600', 'text-white');
      } else {
        panel.classList.add('hidden');
        btn.classList.remove('bg-cyan-600', 'text-white');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'n') {
        toggleNotes();
      }
    });

    // Initialize
    renderSlide(0);
  </script>
</body>
